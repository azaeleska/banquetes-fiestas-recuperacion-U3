<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Acceso - Momentos Especiales</title><style>body{font-family:Arial;background:#eef2ff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login{background:white;width:360px;padding:32px;border-radius:12px;box-shadow:0 8px 22px #0003}h1{color:#2563eb;font-size:24px}label,input,select,button{display:block;width:100%;box-sizing:border-box;margin-top:10px}input,select{padding:10px;border:1px solid #94a3b8;border-radius:6px}button{margin-top:22px;padding:11px;background:#2563eb;color:white;border:0;border-radius:6px;font-size:16px}</style></head><body><main class="login"><h1>Momentos Especiales</h1><p>Iniciar sesión</p><form onsubmit="return validarLogin()"><label for="usuario">Usuario</label><input id="usuario" type="text" placeholder="Escribe tu usuario"><label for="contrasena">Contraseña</label><input id="contrasena" type="password" placeholder="Escribe tu contraseña"><label for="rol">Rol</label><select id="rol"><option value="">Selecciona un rol</option><option>PL</option><option>DEV</option><option>DBA</option><option>QA</option></select><button type="submit">Ingresar</button></form></main><script>function validarLogin(){const usuario=document.getElementById("usuario").value.trim();const contrasena=document.getElementById("contrasena").value.trim();const rol=document.getElementById("rol").value;if(!usuario||!contrasena||!rol){alert("Completa usuario, contraseña y rol.");return false}if(contrasena.length<6){alert("La contraseña debe tener al menos 6 caracteres.");return false}alert("Acceso validado para el rol: "+rol);return false}</script></body></html>
